services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: optimizer
      POSTGRES_PASSWORD: optimizer
      POSTGRES_DB: optimizer
    ports:
      - "5432:5432"
    volumes:
      - optimizer_db:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://optimizer:optimizer@db:5432/optimizer
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_SMALL_MODEL: ${GEMINI_SMALL_MODEL:-gemini-2.5-flash-lite}
      GEMINI_LARGE_MODEL: ${GEMINI_LARGE_MODEL:-gemini-2.5-flash}
    depends_on:
      - db
    ports:
      - "80:8000"
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  optimizer_db:
